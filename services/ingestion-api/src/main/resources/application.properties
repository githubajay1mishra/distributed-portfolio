# System Design Performance Optimization: Enable Java 21 Virtual Threads
# This instructs the runtime to map execution to millions of lightweight threads
spring.threads.virtual.enabled=true

# gRPC Server Configuration Binding
# Listen on port 9090 inside our system boundary
grpc.server.port=9090

# Management & System Design Telemetry Endpoints
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
